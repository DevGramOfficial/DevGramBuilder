[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DevGramBuilder"
version = "1.0.0"
description = "CLI builder for DevGram .dgplugin packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevGram" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/firedragoq/DevGramBuilder"
Repository = "https://github.com/firedragoq/DevGramBuilder.git"
Documentation = "https://github.com/firedragoq/DevGram/blob/update-12.10.1/docs/DEVGRAM_PLUGIN_SDK.md"
Issues = "https://github.com/firedragoq/DevGramBuilder/issues"

[project.scripts]
dgb = "devgram_builder.cli:main"
devgram-builder = "devgram_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
