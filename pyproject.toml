[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DevGramBuilder"
version = "1.2.0"
description = "CLI builder for DevGram .dgplugin packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DevGram" }]
dependencies = ["pyzipper>=0.3.6,<0.4"]

[project.urls]
Homepage = "https://docs.devgram.space/docs/builder"
Repository = "https://github.com/DevGramOfficial/DevGramBuilder.git"
Documentation = "https://docs.devgram.space/docs/builder"
Issues = "https://github.com/DevGramOfficial/DevGramBuilder/issues"

[project.scripts]
dgb = "devgram_builder.cli:main"
devgram-builder = "devgram_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
